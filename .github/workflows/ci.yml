name: Java CI with Maven

# 1. Khi nào thì chạy kịch bản này?
on:
  push:
    branches: [ "main", "develop" ] # Khi push code vào nhánh main hoặc develop
  pull_request:
    branches: [ "main", "develop" ] # Khi ai đó tạo Pull Request để gộp code

# 2. Các công việc cần làm
jobs:
  build-and-test:
    runs-on: ubuntu-latest # GitHub sẽ mượn 1 máy ảo chạy Linux Ubuntu

    steps:
      # Bước 1: Kéo code từ GitHub về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Bật bộ nhớ đệm để tải thư viện nhanh hơn

      # Bước 3: Chạy Checkstyle kiểm tra quy chuẩn viết mã
      - name: Run Checkstyle
        run: mvn checkstyle:check

      # Bước 4: Chạy toàn bộ các bài Unit Test với JUnit 5
      - name: Run Unit Tests
        run: mvn test